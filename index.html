<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Will you go on a date with me?</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Google Fonts for elegant typography -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at center, #fff0f3 0%, #ffe3e8 100%);
            overflow: hidden;
            margin: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .elegant-title {
            font-family: 'Dancing Script', cursive;
            color: #d81b60;
            text-shadow: 2px 2px 4px rgba(216, 27, 96, 0.1);
        }

        .btn-yes {
            background-color: #f06292;
            color: white;
            transition: transform 0.3s ease, background-color 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 15px rgba(240, 98, 146, 0.4);
        }

        .btn-yes:hover {
            background-color: #e91e63;
            box-shadow: 0 6px 20px rgba(233, 30, 99, 0.5);
        }

        .btn-no {
            background-color: #f8bbd0;
            color: #880e4f;
            transition: left 0.2s ease, top 0.2s ease;
            box-shadow: 0 4px 15px rgba(248, 187, 208, 0.6);
            z-index: 50; 
        }

        .heart {
            position: absolute;
            bottom: -10vh;
            font-size: 2rem;
            animation: floatUp 4s ease-in infinite, sway 2s ease-in-out infinite alternate;
            opacity: 0.8;
            z-index: 10;
        }

        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-110vh); opacity: 0; }
        }

        @keyframes sway {
            0% { margin-left: 0; }
            100% { margin-left: 50px; }
        }

        .cute-gif {
            max-width: 250px;
            border-radius: 1rem;
            margin: 0 auto 2rem auto;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div id="main-container" class="text-center relative z-20 px-4 w-full flex flex-col items-center justify-center">
        <img src="https://media1.tenor.com/m/mOziqRK9awgAAAAd/mitao-cat.gif" alt="Cute Pleading Cats" class="cute-gif w-48 h-48 object-cover">
        <h1 class="elegant-title text-5xl md:text-7xl font-bold mb-8 md:mb-12">
            Will you go on a date with me?
        </h1>
        <div class="flex flex-row items-center justify-center gap-6 relative w-full max-w-md h-24">
            <button id="yes-btn" class="btn-yes text-xl md:text-2xl font-semibold py-3 px-8 rounded-full focus:outline-none z-30">
                Yes
            </button>
            <button id="no-btn" class="btn-no text-xl md:text-2xl font-semibold py-3 px-8 rounded-full focus:outline-none">
                No
            </button>
        </div>
    </div>

    <div id="celebration-container" class="hidden text-center z-20 px-4 flex-col items-center justify-center">
        <img src="https://media.tenor.com/gUiu1zyxfzYAAAAi/bear-kiss-bear-kisses.gif" alt="Happy Bears Kissing" class="cute-gif w-48 h-48 object-cover">
        <h1 class="elegant-title text-6xl md:text-8xl font-bold mb-4">
            Yay! Can't wait! ❤️
        </h1>
        <p class="text-gray-700 text-lg md:text-xl font-medium mt-4">
            See you soon!
        </p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const yesBtn = document.getElementById('yes-btn');
            const noBtn = document.getElementById('no-btn');
            const mainContainer = document.getElementById('main-container');
            const celebrationContainer = document.getElementById('celebration-container');
            
            let yesScale = 1;
            let moveCount = 0;

            const yesMessages = [
                "Yes",
                "Are you sure?",
                "Think again!",
                "Last chance!",
                "You might regret this!",
                "Have a heart!",
                "Don't be so cold!",
                "Change of heart?",
                "Wouldn't you reconsider?",
                "Is that your final answer?",
                "You're breaking my heart ;("
            ];

            const moveNoButton = (e) => {
                if(e) e.preventDefault();

                // Moderate scale increment capped at 1.6
                if (yesScale < 1.6) {
                    yesScale += 0.1;
                    yesBtn.style.transform = `scale(${yesScale})`;
                }

                if (moveCount < yesMessages.length - 1) {
                    moveCount++;
                }
                yesBtn.innerText = yesMessages[moveCount];

                noBtn.style.position = 'fixed';
                const btnWidth = noBtn.offsetWidth;
                const btnHeight = noBtn.offsetHeight;
                
                const maxX = window.innerWidth - btnWidth - 20;
                const maxY = window.innerHeight - btnHeight - 20;

                const randomX = Math.max(10, Math.floor(Math.random() * maxX));
                const randomY = Math.max(10, Math.floor(Math.random() * maxY));

                noBtn.style.left = `${randomX}px`;
                noBtn.style.top = `${randomY}px`;
            };

            noBtn.addEventListener('mouseover', moveNoButton);
            noBtn.addEventListener('touchstart', moveNoButton, { passive: false });
            noBtn.addEventListener('click', moveNoButton);

            yesBtn.addEventListener('click', () => {
                mainContainer.style.display = 'none';
                celebrationContainer.style.display = 'flex';
                celebrationContainer.classList.remove('hidden');
                createHearts();
            });

            function createHearts() {
                const heartsCount = 30;
                const body = document.querySelector('body');
                // Updated emojis
                const emojis = ['🤍', '❤️', '🦷', '👩🏻‍⚕️', '💉', '🩺'];
                
                for (let i = 0; i < heartsCount; i++) {
                    setTimeout(() => {
                        const heart = document.createElement('div');
                        heart.classList.add('heart');
                        heart.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
                        
                        heart.style.left = Math.random() * 100 + 'vw';
                        const size = Math.random() * 1.5 + 1;
                        heart.style.fontSize = `${size}rem`;
                        heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
                        body.appendChild(heart);

                        setTimeout(() => {
                            heart.remove();
                        }, 6000);
                    }, i * 200);
                }
            }
        });
    </script>
</body>
</html>
